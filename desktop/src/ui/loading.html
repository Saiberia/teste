<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Recapper</title>
<style>
:root{--bg:#f7f7f5;--text:#1d1d1b;--muted:#6b6b66;--accent:#2f5bd3}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--text:#ecebe6;--muted:#a3a29c;--accent:#7b9cff}}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.box{text-align:center;max-width:420px;padding:24px}
.bars{display:flex;gap:6px;justify-content:center;align-items:center;height:48px;margin-bottom:16px}
.bars i{display:block;width:8px;border-radius:4px;background:var(--accent);animation:b 1s ease-in-out infinite}
.bars i:nth-child(1){height:30%}.bars i:nth-child(2){height:60%;animation-delay:.1s}.bars i:nth-child(3){height:100%;animation-delay:.2s}.bars i:nth-child(4){height:70%;animation-delay:.3s}.bars i:nth-child(5){height:40%;animation-delay:.4s}
@keyframes b{50%{transform:scaleY(.4)}}
@media (prefers-reduced-motion:reduce){.bars i{animation:none}}
h1{font-size:18px;margin:0 0 6px}
p{color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="box" role="status" aria-live="polite">
  <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <h1 id="t">Запускаю Recapper…</h1>
  <p id="s">Первый запуск может занять до минуты: загружается модель распознавания речи.</p>
</div>
<script>
const en = new URLSearchParams(location.search).get('lang') === 'en';
if (en) {
  document.documentElement.lang = 'en';
  document.getElementById('t').textContent = 'Starting Recapper…';
  document.getElementById('s').textContent = 'The first start can take up to a minute while the speech recognition model loads.';
}
</script>
</body>
</html>
