<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Recapper</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e3e2dd;--accent:#2f5bd3;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--text:#ecebe6;--muted:#a3a29c;--line:#34332f;--accent:#7b9cff;--bad:#f07a6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 20px}
h1{font-size:20px;margin:0 0 8px;color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:320px;overflow:auto;margin:0}
ul{margin:8px 0 0;padding-left:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1 id="title">Движок Recapper не запустился</h1>
  <p id="message"></p>
  <div class="card">
    <b id="hintTitle">Что можно сделать</b>
    <ul id="hints"></ul>
  </div>
  <div class="card"><pre id="details"></pre></div>
  <p class="muted" id="logLine"></p>
  <div class="row">
    <button id="retry">Повторить</button>
    <button id="logs" class="ghost">Открыть журнал</button>
  </div>
</main>
<script>
const q = new URLSearchParams(location.search);
const en = q.get('lang') === 'en';
const L = en ? {
  title: 'The Recapper engine failed to start', hintTitle: 'What you can do', retry: 'Try again', logs: 'Open log folder', log: 'Log file: ',
  hints: ['Press “Try again”: the first start may take longer while the speech model downloads.',
          'Check that no antivirus or firewall blocks the local engine (it only listens on 127.0.0.1).',
          'Send the log file to support if the problem persists.'],
  devHints: ['Dev mode: install Python 3.10+ and the backend (pip install -e ".[asr]") or set RECAPPER_PYTHON.'],
} : {
  title: 'Движок Recapper не запустился', hintTitle: 'Что можно сделать', retry: 'Повторить', logs: 'Открыть журнал', log: 'Журнал: ',
  hints: ['Нажмите «Повторить»: при первом запуске загрузка модели распознавания речи может занять больше времени.',
          'Проверьте, что антивирус или брандмауэр не блокирует локальный движок (он слушает только 127.0.0.1).',
          'Если ошибка повторяется, отправьте файл журнала в поддержку.'],
  devHints: ['Режим разработки: установите Python 3.10+ и бэкенд (pip install -e ".[asr]") или укажите интерпретатор в RECAPPER_PYTHON.'],
};
const $ = (id) => document.getElementById(id);
document.documentElement.lang = en ? 'en' : 'ru';
$('title').textContent = q.get('title') || L.title;
$('hintTitle').textContent = L.hintTitle;
$('message').textContent = q.get('message') || '';
$('details').textContent = q.get('details') || '—';
$('retry').textContent = L.retry;
$('logs').textContent = L.logs;
if (q.get('log')) $('logLine').textContent = L.log + q.get('log');
for (const h of [...L.hints, ...(q.get('kind') === 'dev' ? L.devHints : [])]) {
  const li = document.createElement('li'); li.textContent = h; $('hints').append(li);
}
const d = window.recapperDesktop;
$('retry').onclick = () => { $('retry').disabled = true; d && d.retryBackend(); };
$('logs').onclick = () => d && d.openLogs();
</script>
</body>
</html>
