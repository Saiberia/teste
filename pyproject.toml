[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recapper"
version = "0.1.0"
description = "Meeting assistant: recap plus draft answers to questions and tasks raised in the meeting"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.9",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-docx>=1.1",
]

[project.optional-dependencies]
bot = ["python-telegram-bot>=21"]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "python-telegram-bot>=21"]

[project.scripts]
recapper = "recapper.cli:main"

[tool.setuptools.packages.find]
include = ["recapper*"]

[tool.setuptools.package-data]
"recapper.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
