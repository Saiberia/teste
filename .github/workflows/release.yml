name: Build installers

# Windows .exe (NSIS) and macOS .dmg (Apple Silicon + Intel), built on native runners
# because the bundled Python server (PyInstaller) cannot be cross-compiled.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/**"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: dist:win
            pattern: desktop/dist/*.exe
          - name: macOS Apple Silicon
            os: macos-latest
            target: dist:mac
            pattern: desktop/dist/*.dmg
          - name: macOS Intel
            os: macos-13
            target: dist:mac
            pattern: desktop/dist/*.dmg
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_PUBLISH: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the bundled server (PyInstaller)
        run: |
          python -m pip install -e ".[asr]" pyinstaller
          python packaging/build_server.py
      - name: Smoke-test the bundled server
        run: python packaging/smoke_test.py
      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci
          npm run ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Recapper-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Recapper build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          body: |
            Установщики Recapper.
            - Windows: `Recapper-Setup-*.exe`
            - macOS Apple Silicon (M1–M4): `Recapper-*-arm64.dmg`
            - macOS Intel: `Recapper-*-x64.dmg`
            Сборки не подписаны: при первом запуске Windows SmartScreen попросит нажать «Подробнее → Выполнить в любом случае»,
            macOS — открыть через правый клик → «Открыть». Подробности в README.
